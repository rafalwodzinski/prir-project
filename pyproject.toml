[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "prir-project"
version = "0.1.0"
description = "Programowanie Równoległe i Rozproszone (PRiR)"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
